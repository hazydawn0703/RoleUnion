name: Community Core boundary

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  community-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check open-source boundary
        run: npm run check:open-source-boundary

      - name: Check syntax and types
        run: npm run typecheck

      - name: Run Community Core checks
        run: npm run check
